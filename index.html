<!DOCTYPE html>

<style>

#pn{bottom:calc(env(safe-area-inset-bottom,0px) + 132px);font-size:17px;letter-spacing:.25em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}

</style>
</head>

<div class="ui" id="bar"><button id="mu">음악 켜기</button><button id="swb" style="display:none">검술</button><button id="sit">앉기</button><button id="qi">기 모으기</button></div>

<script>

const scene=new THREE.Scene();(function(){const cv=document.createElement('canvas');cv.width=4;cv.height=256;const g=cv.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#42558a');gr.addColorStop(.55,'#9fa8cc');gr.addColorStop(1,'#f0d4ac');g.fillStyle=gr;g.fillRect(0,0,4,256);scene.background=new THREE.CanvasTexture(cv)})();scene.fog=new THREE.FogExp2(0x9aa0bc,.0045);

// floor texture: taiji + bagua
function floorTex(){
 const s=1024,c=s/2,R=270,cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d');
 g.fillStyle='#1b1511';g.fillRect(0,0,s,s);
 g.strokeStyle='#d4b46a';g.lineWidth=6;
 [R+14,R+170,c-8].forEach(r=>{g.beginPath();g.arc(c,c,r,0,7);g.stroke()});
 g.fillStyle='#d9d3bf';g.beginPath();g.arc(c,c,R,0,7);g.fill();
 g.fillStyle='#10131c';g.beginPath();g.arc(c,c,R,Math.PI/2,Math.PI*1.5);g.fill();
 g.beginPath();g.arc(c,c-R/2,R/2,0,7);g.fill();
 g.fillStyle='#d9d3bf';g.beginPath();g.arc(c,c+R/2,R/2,0,7);g.fill();
 g.beginPath();g.arc(c,c-R/2,R/8,0,7);g.fill();
 g.fillStyle='#10131c';g.beginPath();g.arc(c,c+R/2,R/8,0,7);g.fill();
 const tri=[7,3,5,1,6,2,4,0];g.fillStyle='#d4b46a';
 tri.forEach((b,i)=>{g.save();g.translate(c,c);g.rotate(i*Math.PI/4);g.translate(0,-(R+92));
  for(let k=0;k<3;k++){const y=-26+k*26,yang=(b>>k)&1;
   if(yang)g.fillRect(-42,y,84,14);else{g.fillRect(-42,y,34,14);g.fillRect(8,y,34,14)}}
  g.restore()});
 return new THREE.CanvasTexture(cv);
}
function floorTex2(){
 const s=1024,c=s/2,R=250,cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d');
 g.fillStyle='#c4955f';g.fillRect(0,0,s,s);
 for(let y=0;y<s;y+=64){g.fillStyle=(y/64)%2?'rgba(120,80,40,.12)':'rgba(255,230,180,.1)';g.fillRect(0,y,s,64);g.fillStyle='rgba(70,40,15,.5)';g.fillRect(0,y,s,3)}
 g.fillStyle='#f3ead6';g.beginPath();g.arc(c,c,R+50,0,7);g.fill();g.strokeStyle='#7a4a22';g.lineWidth=8;g.stroke();
 g.fillStyle='#1f4e9a';g.beginPath();g.arc(c,c,R,0,7);g.fill();
 g.fillStyle='#c8372d';g.beginPath();g.arc(c,c,R,Math.PI,2*Math.PI);g.fill();
 g.beginPath();g.arc(c+R/2,c,R/2,0,7);g.fill();
 g.fillStyle='#1f4e9a';g.beginPath();g.arc(c-R/2,c,R/2,0,7);g.fill();
 g.fillStyle='#1a1612';
 [[-45,7],[45,2],[135,0],[-135,5]].forEach(([d,b])=>{g.save();g.translate(c,c);g.rotate(d*Math.PI/180);g.translate(0,-(R+140));
  for(let k=0;k<3;k++){const x=-28+k*28;if((b>>k)&1)g.fillRect(x,-45,16,90);else{g.fillRect(x,-45,16,38);g.fillRect(x,7,16,38)}}
  g.restore()});
 return new THREE.CanvasTexture(cv);
}

const floor=new THREE.Mesh(new THREE.CircleGeometry(14,64),new THREE.MeshStandardMaterial({map:tex,roughness:.8}));

// 바깥 세상: 땅, 길, 일주문, 백두산
(function(){
 const gnd=new THREE.Mesh(new THREE.CircleGeometry(700,48),new THREE.MeshStandardMaterial({color:0x6a8048,roughness:1}));gnd.rotation.x=-Math.PI/2;gnd.position.y=-.03;scene.add(gnd);
 const path=new THREE.Mesh(new THREE.BoxGeometry(4.2,.05,32),new THREE.MeshStandardMaterial({color:0xb9b3a3,roughness:1}));path.position.set(0,.01,29);scene.add(path);
 const rm=new THREE.MeshStandardMaterial({color:0x8a2a1e}),gm=new THREE.MeshStandardMaterial({color:0x2f7d5b}),ym=new THREE.MeshStandardMaterial({color:0xe0b040});
 [-2.8,2.8].forEach(x=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.36,.4,6,12),rm);p.position.set(x,3,36);scene.add(p)});
 [[7.6,.6,.9,5.7,gm],[7.6,.2,.95,5.3,ym],[9.4,.4,2.6,6.3,new THREE.MeshStandardMaterial({color:0x2a2a30})]].forEach(([w,h,d,y,m])=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(0,y,36);scene.add(b)});
 const tm=new THREE.MeshStandardMaterial({color:0x2d5a3a,flatShading:true});
 for(let i=0;i<40;i++){const a=Math.random()*6.283,r=20+Math.random()*50,x=Math.sin(a)*r,z=Math.cos(a)*r;if((Math.abs(x)<5&&z>0)||Math.hypot(x+40,z-18)<20)continue;const s=.8+Math.random()*1.1,t=new THREE.Mesh(new THREE.ConeGeometry(1.5*s,6*s,7),tm);t.position.set(x,3*s,z);scene.add(t)}
 for(let i=0;i<16;i++){const a=i/16*Math.PI*2+Math.random()*.2;if(Math.abs(a-Math.PI)<.7)continue;const d=260+Math.random()*80,h=25+Math.random()*30;const cn=new THREE.Mesh(new THREE.ConeGeometry(40+Math.random()*30,h,7),new THREE.MeshStandardMaterial({color:0x6b7a62,flatShading:true}));cn.position.set(Math.sin(a)*d,h/2-.2,Math.cos(a)*d);scene.add(cn)}
 // 백두산 (천지 칼데라)
 const prof=[[120,0],[100,6],[78,20],[58,38],[42,52],[32,62],[26,66],[20,60],[14,56],[10,54],[0,54]].map(([r,y])=>new THREE.Vector2(r,y));
 const geo=new THREE.LatheGeometry(prof,64),pos=geo.attributes.position,col=new Float32Array(pos.count*3);
 for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i),a=Math.atan2(z,x);
  const j=(Math.sin(a*7)*2.4+Math.sin(a*17)*1.4+Math.sin(a*3)*1.8)*Math.min(1,y/50);if(y>30)pos.setY(i,y+j);
  const h=y/66;let c;if(h>.72)c=[.95,.95,.97];else if(h>.45){const q=.2*(h-.45);c=[.52+q,.5+q,.48+q]}else c=[.3+.4*h,.4+.2*h,.25+.2*h];col.set(c,i*3)}
 geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();
 const mt=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1,side:THREE.DoubleSide}));mt.position.set(0,-.2,-230);scene.add(mt);
 const lake=new THREE.Mesh(new THREE.CircleGeometry(12,40),new THREE.MeshStandardMaterial({color:0x2f78c8,roughness:.2,emissive:0x0e2a50}));lake.rotation.x=-Math.PI/2;lake.position.set(0,54.4,-230);scene.add(lake);
})();
// 창호 벽
(function(){const cv=document.createElement('canvas');cv.width=512;cv.height=256;const g=cv.getContext('2d');
 g.fillStyle='#f1e6c8';g.fillRect(0,0,512,256);g.strokeStyle='#6b4423';g.lineWidth=5;
 for(let x=0;x<=512;x+=32){g.beginPath();g.moveTo(x,20);g.lineTo(x,236);g.stroke()}
 for(let y=20;y<=236;y+=36){g.beginPath();g.moveTo(0,y);g.lineTo(512,y);g.stroke()}
 g.lineWidth=12;[0,128,256,384,512].forEach(x=>{g.beginPath();g.moveTo(x,0);g.lineTo(x,256);g.stroke()});
 g.beginPath();g.moveTo(0,20);g.lineTo(512,20);g.moveTo(0,236);g.lineTo(512,236);g.stroke();
 const t=new THREE.CanvasTexture(cv);t.wrapS=THREE.RepeatWrapping;t.repeat.set(4,1);
 const w=new THREE.Mesh(new THREE.CylinderGeometry(14,14,8,48,1,true,.25,Math.PI*2-.5),new THREE.MeshBasicMaterial({map:t,color:0xd8cdb4,side:THREE.DoubleSide}));w.position.y=4;scene.add(w)})();
// 백호 (엄마와 아기)
const tigers=[];
function makeTiger(sc,hs){
 const g=new THREE.Group(),inner=new THREE.Group();inner.scale.setScalar(sc);g.add(inner);
 const wh=new THREE.MeshStandardMaterial({color:0xf7f6f0,roughness:1}),st=new THREE.MeshStandardMaterial({color:0x30343c}),pk=new THREE.MeshStandardMaterial({color:0xe8a8a8}),bl=new THREE.MeshStandardMaterial({color:0x7fc4ff,emissive:0x2a5a88});
 const add=(geo,mat,x,y,z,p)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);p.add(m);return m};
 const body=new THREE.Group();inner.add(body);
 add(new THREE.SphereGeometry(1,16,12),wh,0,1,0,body).scale.set(.5,.52,1.05);
 for(let i=0;i<6;i++){const z=-.65+i*.26,x=.5*Math.sqrt(Math.max(.05,1-(z/1.05)**2-.083))+.01;[-1,1].forEach(s=>{add(new THREE.BoxGeometry(.05,.34,.08),st,s*x,1.15,z,body).rotation.z=s*.25})}
 for(let i=0;i<4;i++){const z=-.5+i*.33;add(new THREE.BoxGeometry(.34,.04,.08),st,0,1+.52*Math.sqrt(1-(z/1.05)**2),z,body)}
 const head=new THREE.Group();head.position.set(0,1.15,.95);head.scale.setScalar(hs);inner.add(head);
 add(new THREE.SphereGeometry(.38,16,12),wh,0,0,.3,head);add(new THREE.SphereGeometry(.2,12,10),wh,0,-.1,.62,head);add(new THREE.SphereGeometry(.05,8,8),pk,0,0,.8,head);
 [-1,1].forEach(s=>{add(new THREE.SphereGeometry(.05,8,8),bl,s*.17,.1,.58,head);add(new THREE.SphereGeometry(.12,10,8),wh,s*.24,.3,.2,head);add(new THREE.SphereGeometry(.07,8,8),pk,s*.24,.3,.27,head);add(new THREE.BoxGeometry(.04,.14,.05),st,s*.1,.34,.5,head)});
 const tail=new THREE.Group();tail.position.set(0,1.1,-.95);tail.rotation.x=-.4;inner.add(tail);
 add(new THREE.CylinderGeometry(.07,.06,1,8),wh,0,0,-.5,tail).rotation.x=Math.PI/2;add(new THREE.SphereGeometry(.08,8,8),st,0,0,-1,tail);
 const legs=[];[[-.28,.62],[.28,.62],[-.28,-.62],[.28,-.62]].forEach(([x,z])=>{const lg=new THREE.Group();lg.position.set(x,.9,z);inner.add(lg);add(new THREE.CylinderGeometry(.13,.1,.8,8),wh,0,-.4,0,lg);add(new THREE.SphereGeometry(.13,8,8),wh,0,-.78,.03,lg);legs.push(lg)});
 return {g,body,head,tail,legs,ph:Math.random()*6,ph0:Math.random()*6,wait:0,rt:0,tg:{x:0,z:0}};
}
function tmove(o,dx,dz,d,sp){const p=o.g.position,s=Math.min(d,sp);p.x+=dx/d*s;p.z+=dz/d*s;pushObs(p);const da=((Math.atan2(dx,dz)-o.g.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;o.g.rotation.y+=da*.12}
function tig(o,dt,t){
 const p=o.g.position;let mv=false;
 if(o.kind==='mom'){
  if(o.wait>0)o.wait-=dt;else{const dx=o.tg.x-p.x,dz=o.tg.z-p.z,d=Math.hypot(dx,dz);
   if(d<.4){o.wait=3+Math.random()*5;const a=Math.atan2(p.x,p.z)+(Math.random()-.5)*1.3,r=20+Math.random()*22;o.tg={x:Math.sin(a)*r,z:Math.cos(a)*r}}
   else{tmove(o,dx,dz,d,1.3*dt);mv=true}}
 }else{
  const m=tigers[0].g.position;o.rt-=dt;
  if(o.rt<=0){o.rt=2+Math.random()*2.5;const a=Math.random()*6.283,r=1.5+Math.random()*2.5;o.tg={x:m.x+Math.sin(a)*r,z:m.z+Math.cos(a)*r}}
  const dx=o.tg.x-p.x,dz=o.tg.z-p.z,d=Math.hypot(dx,dz);
  if(d>.3){tmove(o,dx,dz,d,Math.min(3,d*1.4+.4)*dt);mv=true}
 }
 const mom=o.kind==='mom';if(mv)o.ph+=dt*(mom?5:9);
 const sw=mv?Math.sin(o.ph)*.6:0;
 o.legs[0].rotation.x=sw;o.legs[3].rotation.x=sw;o.legs[1].rotation.x=-sw;o.legs[2].rotation.x=-sw;
 o.body.position.y=mv?Math.abs(Math.sin(o.ph))*(mom?.04:.09):Math.sin(t*1.5+o.ph0)*.01;
 o.tail.rotation.y=Math.sin(t*2.2+o.ph0)*.5;o.head.rotation.x=mv?0:Math.sin(t*.8+o.ph0)*.1;
}
{const mom=makeTiger(1,1);mom.kind='mom';mom.g.position.set(14,0,26);mom.tg={x:22,z:30};mom.wait=2;scene.add(mom.g);tigers.push(mom);
 const cub=makeTiger(.5,1.35);cub.kind='cub';cub.g.position.set(11.5,0,27.5);scene.add(cub.g);tigers.push(cub)}
// 마을 배치와 충돌 원
const HL=[[-9.5,48],[-10,56],[-9.5,64],[-10,72],[-9.5,80],[-10,88]],HR=[[9.5,52],[10,60],[9.5,68],[10,76],[9.5,84]],WM={x:-22,z:78},FT={x:0,z:66},STL=[[-4.2,70],[4.2,62],[0,73]];
const OBS=[{x:0,z:0,r:1.7},{x:-40,z:18,r:17.5},{x:18,z:44,r:3.2},{x:-18,z:50,r:3.2},{x:26,z:30,r:3.2}];
HL.concat(HR).forEach(([x,z])=>OBS.push({x,z,r:3.1}));OBS.push({x:WM.x,z:WM.z,r:2.6},{x:FT.x,z:FT.z,r:2.8});STL.forEach(([x,z])=>OBS.push({x,z,r:1.8}));
const inObs=(x,z,m)=>OBS.some(o=>Math.hypot(x-o.x,z-o.z)<o.r+(m||0));
function pushObs(p){for(const o of OBS){const dx=p.x-o.x,dz=p.z-o.z,d=Math.hypot(dx,dz);if(d<o.r){if(d<.001){p.x+=o.r;continue}const k=o.r-d,nx=dx/d,nz=dz/d;p.x+=nx*k-nz*k*.4;p.z+=nz*k+nx*k*.4}}}
// 약초와 꽃밭
(function(){
 const dm=new THREE.Object3D(),rnd=(a,b)=>a+Math.random()*(b-a);
 const types=[[0xffffff,.45],[0x7a4fc4,.5],[0xf2d230,.3],[0xf08a24,.7],[0xf49ac2,.6],[0xd0312d,.35]];
 const greens=[0x4f8a3a,0x5d9a45,0x3f7a35,0x8aa07a],fl=[],lv=[],mu=[];
 const bad=(x,z)=>Math.hypot(x,z)<10||(Math.abs(x)<3.4&&z>8&&z<45)||Math.hypot(x+40,z-18)<20||inObs(x,z,2.5)||(Math.abs(x)<16&&z>40&&z<95);
 for(let p=0;p<22;p++){
  const a0=rnd(0,6.283),r0=rnd(19,58),cx=Math.sin(a0)*r0,cz=Math.cos(a0)*r0,ty=types[p%types.length];
  for(let i=0;i<14;i++){const a=rnd(0,6.283),r=rnd(0,4.5),x=cx+Math.sin(a)*r,z=cz+Math.cos(a)*r;if(bad(x,z))continue;
   fl.push({x,z,h:ty[1]*rnd(.8,1.3),c:ty[0]});lv.push({x:x+rnd(-.3,.3),z:z+rnd(-.3,.3),s:rnd(.8,1.4),c:greens[(Math.random()*4)|0]})}
  for(let i=0;i<14;i++){const a=rnd(0,6.283),r=rnd(0,5.5),x=cx+Math.sin(a)*r,z=cz+Math.cos(a)*r;if(bad(x,z))continue;lv.push({x,z,s:rnd(.9,1.8),c:greens[(Math.random()*4)|0]})}
  if(p%4===2)for(let i=0;i<5;i++){const x=cx+rnd(-2,2),z=cz+rnd(-2,2);if(!bad(x,z))mu.push({x,z,s:rnd(.8,1.5)})}
 }
 const mk=(geo,mat,arr,fn,col)=>{const m=new THREE.InstancedMesh(geo,mat,arr.length);arr.forEach((o,i)=>{fn(o);dm.updateMatrix();m.setMatrixAt(i,dm.matrix);if(col)m.setColorAt(i,new THREE.Color(col(o)))});scene.add(m)};
 const wm=()=>new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9});
 mk(new THREE.CylinderGeometry(.015,.02,1,5),new THREE.MeshStandardMaterial({color:0x4a7a35}),fl,o=>{dm.position.set(o.x,o.h/2,o.z);dm.scale.set(1,o.h,1);dm.rotation.set(0,0,0)});
 mk(new THREE.SphereGeometry(.13,8,6),wm(),fl,o=>{dm.position.set(o.x,o.h+.02,o.z);dm.scale.set(1.2,.55,1.2);dm.rotation.set(0,0,0)},o=>o.c);
 mk(new THREE.ConeGeometry(.2,.45,5),wm(),lv,o=>{dm.position.set(o.x,.2*o.s,o.z);dm.scale.setScalar(o.s);dm.rotation.set(rnd(-.3,.3),rnd(0,6),rnd(-.3,.3))},o=>o.c);
 mk(new THREE.CylinderGeometry(.05,.06,.22,6),new THREE.MeshStandardMaterial({color:0xe8dcc0}),mu,o=>{dm.position.set(o.x,.11*o.s,o.z);dm.scale.setScalar(o.s);dm.rotation.set(0,0,0)});
 mk(new THREE.SphereGeometry(.17,8,6),new THREE.MeshStandardMaterial({color:0x8b2f1d}),mu,o=>{dm.position.set(o.x,.24*o.s,o.z);dm.scale.set(o.s*1.1,o.s*.55,o.s*1.1);dm.rotation.set(0,0,0)});
})();
// 흰 사슴과 토끼
const animals=[];
function makeDeer(sc,hs,spots){
 const g=new THREE.Group(),inner=new THREE.Group();inner.scale.setScalar(sc);g.add(inner);
 const wh=new THREE.MeshStandardMaterial({color:0xf8f7f2,roughness:1}),dk=new THREE.MeshStandardMaterial({color:0x2a2a2e}),pk=new THREE.MeshStandardMaterial({color:0xe9b9b9}),spm=new THREE.MeshStandardMaterial({color:0xd9d3c4});
 const add=(geo,mat,x,y,z,p)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);p.add(m);return m};
 const body=new THREE.Group();inner.add(body);
 add(new THREE.SphereGeometry(1,16,12),wh,0,1.2,0,body).scale.set(.38,.4,.85);add(new THREE.SphereGeometry(.13,8,8),wh,0,1.32,-.82,body);

 const nx=p.x+D*ds*(d[0]*rx+d[1]*fx),nz=p.z+D*ds*(d[0]*rz+d[1]*fz);
 if(Math.hypot(nx,nz)<100){p.x=nx;p.z=nz}
 pushObs(p);
}

function endSword(m){m.g.position.y=0;if(m.glow)m.glow.visible=false;m.hs.children[2].material.emissive.setHex(0);m.hs.visible=false;m.swd.visible=true;m.g.rotation.y=m.sy;m.body.rotation.set(0,0,0);m.lp.forEach(l=>{l.position.y=.5;l.rotation.set(0,0,0)});stand(m,true);m.state='idle';swBtn.textContent='검술'}
function startSword(m){if(!m.glow){m.glow=new THREE.Mesh(new THREE.BoxGeometry(.16,.95,.12),new THREE.MeshBasicMaterial({color:0x66ddff,transparent:true,opacity:.4,blending:THREE.AdditiveBlending,depthWrite:false}));m.glow.position.y=-.52;m.hs.add(m.glow)}m.glow.visible=true;m.hs.children[2].material.emissive.setHex(0x3aa8d8);m.fc=-1;m.fk=0;m.ty=m.sy;m.dc=-1;m.ds=0;m.state='sword';m.sw=0;m.sy=m.g.rotation.y;m.ty=m.sy;m.path=[];stand(m,true);m.swd.visible=false;m.hs.visible=true;swBtn.textContent='검 넣기'}
swBtn.onclick=()=>{const p=monks[0];if(p.state==='sword')endSword(p);else startSword(p)};
// loop
const clock=new THREE.Clock(),bEl=null;
function loop(){
 const t=clock.getElapsedTime(),cyc=t%10,inh=cyc<4;
 const k=inh?cyc/4:1-(cyc-4)/6;
 
 curT=t;
 const dt=Math.min(t-lastT,.05);lastT=t;
 monks.forEach((o,i)=>o.state==='abd'?0:o.state==='stun'?stunUpd(o,dt,t):(o.state==='hunt'||o.state==='atk')?hunt(o,dt,t):(o.state==='cook'?cookUpd(o,dt,t):(o.state!=='sit'?upd(o,dt,t,k):yoga(o,dt,t))));
 tigers.forEach(o=>tig(o,dt,t));animals.forEach(o=>ani(o,dt,t));updQi(dt);
 {const p0=monks[0];if(p0.gt!==undefined&&curT<p0.gt&&p0.state==='idle'){p0.arms[0].rotation.set(-1.3,0,.5);p0.arms[1].rotation.set(-1.3,0,-.5)}}
 updGather(dt);updVillage(t);updBugs(dt,t);updCamp(dt,t);updDragon(dt,t);updUfos(dt,t);updHit(dt,t);
 aura.position.set(monks[0].g.position.x,.05,monks[0].g.position.z);aura.scale.setScalar(1+.12*k);
 {const out=Math.hypot(monks[0].g.position.x,monks[0].g.position.z)>9;if(out!==swVis){swVis=out;swBtn.style.display=out?'':'none'}}
 {const pp=monks[0].state==='sit'?monks[0].pp:-1,gg=monks[0].gt!==undefined&&curT<monks[0].gt,nm=monks[0].state==='sword'?SWN[Math.floor(monks[0].sw/DUR)%15]:(gg?'기 모으기':(pp>=0?YN[pp]:''));if(nm!==pnLast){pnLast=nm;pnEl.textContent=nm}}aura.material.opacity=.6+.4*k;
 lights.forEach((L,i)=>L.intensity=1.1+Math.sin(t*7+i*2)*.15+Math.random()*.1);
 disc.rotation.z=-t*.05;
 const pa=sg.attributes.position.array;
 for(let i=0;i<N;i++){pa[i*3+1]+=sv[i]*.012;pa[i*3]+=Math.sin(t+i)*.0015;if(pa[i*3+1]>7.5)pa[i*3+1]=1.5}
 sg.attributes.position.needsUpdate=true;
 for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.t+=.012;r.scale.setScalar(1+r.t*9);r.material.opacity=.8*(1-r.t);if(r.t>=1){scene.remove(r);ripples.splice(i,1)}}
 focus.lerp(monks[0].g.position,.06);const dd=rad*Math.cos(ph)+3;
 cam.position.set(focus.x+Math.sin(th)*dd,1.9+rad*Math.sin(ph),focus.z+Math.cos(th)*dd);
 cam.lookAt(focus.x-Math.sin(th)*5,1.2,focus.z-Math.cos(th)*5);
 renderer.render(scene,cam);requestAnimationFrame(loop);
}
loop();
</script>
